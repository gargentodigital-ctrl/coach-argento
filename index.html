<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaching PT Gio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ECEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Coaching PT Gio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* telefono in orizzontale: iOS non permette di bloccare la rotazione a un'app web, quindi copro lo schermo con un invito a girarlo */
.rotate{display:none}
@media (orientation:landscape) and (max-height:520px){
  .rotate{display:flex;position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  .rotate svg{width:64px;height:64px}
  .rotate b{font-family:var(--display);font-size:1.6rem;text-transform:uppercase}
  #app,.toast,.nav{visibility:hidden}
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
/* Layout: una colonna da palestra, una cosa alla volta; nav in basso; timer a tutto schermo. Palette: ghisa + colori dei dischi da gara */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --sunk:#E1E5E8; --fg:#14191D; --muted:#5A646C; --line:#CDD3D8;
  --accent:#1F4FD1; --accent-fg:#FFFFFF; --plate-y:#E8B110; --good:#1D8A4E; --warn:#B7790B; --bad:#C2352B;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101316; --surface:#191E22; --sunk:#22282D; --fg:#E9ECEE; --muted:#97A2AA; --line:#2E363C;
  --accent:#5C87FF; --accent-fg:#0B1020; --plate-y:#F2C230; --good:#3DBB76; --warn:#E3A93A; --bad:#F06A5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101316; --surface:#191E22; --sunk:#22282D; --fg:#E9ECEE; --muted:#97A2AA; --line:#2E363C;
  --accent:#5C87FF; --accent-fg:#0B1020; --plate-y:#F2C230; --good:#3DBB76; --warn:#E3A93A; --bad:#F06A5E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2.1rem;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:1.4rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:var(--r);font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-ghost{background:var(--sunk);color:var(--fg)}
.btn-big{min-height:64px;font-size:1.45rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.coach{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.2}

/* home */
.sedute{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sed{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-height:96px}
.sed .L{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1}
.sed .T{font-weight:600}
.sed .S{font-size:.85rem;color:var(--muted)}
.sed[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sed .est{position:absolute;top:10px;right:10px;font-family:var(--display);font-weight:700;font-size:.95rem;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--fg);font-variant-numeric:tabular-nums}
.sed .tick{position:absolute;bottom:10px;right:10px;font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--good);color:var(--surface)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r);padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:7px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.weekbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.weekbar span{height:10px;border-radius:3px;background:var(--sunk)}
.weekbar span.on{background:var(--good)}

/* workout */
.wtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--sunk)}
.prog i.done{background:var(--good)}.prog i.cur{background:var(--accent)}
.exname{font-size:2.2rem;font-weight:800;text-transform:uppercase}
.target{font-family:var(--display);font-size:1.3rem;font-weight:600}
.pill{display:inline-flex;align-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--fg)}
.pill.y{background:var(--plate-y);color:#1a1400}
.note{border-left:3px solid var(--plate-y);padding:2px 0 2px 10px;color:var(--fg)}
.setdots{display:flex;gap:8px;flex-wrap:wrap}
.setdots b{min-width:44px;height:36px;padding:0 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1rem;font-weight:700;background:var(--sunk);color:var(--muted)}
.setdots b.done{background:var(--good);color:var(--surface)}
.setdots b.cur{background:var(--accent);color:var(--accent-fg)}
.setdots button{min-width:44px;height:36px;padding:0 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1rem;font-weight:700;background:var(--good);color:var(--surface)}
.setdots button.cur{background:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.editbar{display:flex;flex-direction:column;gap:2px;background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:12px 14px}
.restbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:6;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.restbar b{grid-row:span 2;font-family:var(--display);font-size:1.8rem;font-weight:800}
.restbar span:last-child{font-size:.85rem;opacity:.8}
.nextcard{width:100%;max-width:400px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.nxname{font-family:var(--display);font-size:1.5rem;font-weight:800;text-transform:uppercase;line-height:1.1}
.rest.withnext{justify-content:flex-start;overflow-y:auto}
.rest.withnext .ring{width:min(56vw,220px)}
.rest.withnext .ring .t b{font-size:4rem}
.sugg{background:color-mix(in srgb,var(--plate-y) 22%,var(--surface));border:2px solid var(--plate-y);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sugg p{margin:0;font-weight:600}.sugg p.si{font-weight:500;font-size:.92rem;color:var(--muted)}
.sugg button{width:32px;height:32px;border-radius:8px;color:var(--muted)}
.sugg-mini{background:color-mix(in srgb,var(--plate-y) 25%,transparent);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.92rem}
.sheetbg{position:fixed;inset:0;z-index:30;background:rgba(10,14,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.danger-btn{color:var(--bad)}
.winp{width:100%;height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:inherit;font-size:1.3rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.watchline{font-size:.88rem;font-weight:600;color:var(--fg);background:var(--sunk);border-radius:8px;padding:6px 10px;align-self:flex-start}
.walert{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wbox{width:100%;max-width:420px;background:#E6FF00;color:#000;border-radius:16px;padding:28px 20px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.wmain{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;text-transform:uppercase;color:#000}
.wsub{font-weight:700;color:#000;font-size:1rem}
.wbox .wgo{width:100%;background:#000;color:#E6FF00;min-height:60px}
.wbox .wno{color:#000;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}
@media (prefers-reduced-motion:no-preference){.wbox{animation:wpop .25s ease-out}@keyframes wpop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}}
.gear{width:44px;height:44px;border-radius:12px;background:var(--sunk);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none}
.back{font-weight:600;color:var(--muted);padding:8px 0}
.linkset{color:var(--accent);font-weight:600;text-align:left;padding:6px 0}
.steprow{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.steprow>div:first-child{display:flex;flex-direction:column;gap:2px}.steprow .muted{font-size:.82rem}
.stepseg{grid-template-columns:repeat(5,1fr)}.stepseg button{min-height:40px;font-variant-numeric:tabular-nums}
.tog{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tog[aria-checked="true"]{background:var(--good)}.tog[aria-checked="true"] i{left:23px}
.chatwrap{min-height:calc(100vh - 120px)}
.chatlist{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.45;overflow-wrap:anywhere}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}.bub ul{margin:4px 0 6px;padding-left:20px}.bub li{margin:2px 0}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.err{border-color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 12px;border-radius:99px;background:var(--sunk);font-weight:600;font-size:.88rem;white-space:nowrap}
.chatbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-block:8px}
.chatbar textarea{flex:1;min-height:48px;max-height:140px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;padding:12px;resize:none}
.chatbar .btn{min-height:48px}
.keyin{width:100%;height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:inherit;padding:0 12px}
.fixlast{color:inherit;opacity:.8;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px}
.part{display:flex;flex-direction:column;gap:8px}
.part+.part{border-top:1px dashed var(--line);padding-top:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields.one{grid-template-columns:1fr}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--sunk);border-radius:var(--r);overflow:hidden}
.step button{height:52px;font-size:1.5rem;font-weight:600}
.step input{width:100%;min-width:0;height:52px;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:1.8rem;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.last{font-size:.9rem;color:var(--muted)}
.worktimer{font-family:var(--display);font-size:3.2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.navex{display:flex;justify-content:space-between;gap:10px}
.navex button{font-weight:600;color:var(--muted);padding:8px 4px}

/* rest overlay */
.rest{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-family:var(--display);font-size:5.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rest .ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:360px}
.rest .next{max-width:360px}
.rest.go{background:var(--accent);color:var(--accent-fg)}

/* week */
.wnav{display:flex;align-items:center;justify-content:space-between}
.wnav button{width:44px;height:44px;border-radius:var(--r);background:var(--sunk);font-size:1.3rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{display:grid;grid-template-columns:6px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 0;overflow:hidden}
.msg::before{content:"";border-radius:0 3px 3px 0}
.msg.good::before{background:var(--good)}.msg.push::before{background:var(--accent)}.msg.warn::before{background:var(--warn)}.msg.bad::before{background:var(--bad)}
.msg div{min-width:0}
.msg strong{display:block;font-family:var(--display);font-size:1.1rem;font-weight:700}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.hrow table{width:100%;border-collapse:collapse;font-size:.92rem}
.hrow td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top}
.hrow td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.danger{color:var(--bad);font-weight:600}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filebtn{cursor:pointer}
.pcard{min-width:0;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px}
.pcard[aria-pressed="true"]{border-color:var(--accent)}
.pcard .pn{font-family:var(--display);font-size:1.25rem;font-weight:700;text-transform:uppercase;line-height:1.1}
.psed{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px;font-size:.92rem}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.nav div{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:560px}
.nav button{min-height:48px;border-radius:8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--sunk);color:var(--fg)}
.rpe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rpe button{min-height:48px;border-radius:8px;background:var(--sunk);font-family:var(--display);font-size:1.3rem;font-weight:700}
.rpe button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
textarea{width:100%;min-height:80px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:inherit;padding:10px;resize:vertical;box-sizing:border-box}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;max-width:calc(100% - 32px)}
.sync{font-size:.8rem}
.exn{display:inline}
.vid{display:inline-flex;align-items:center;justify-content:center;width:34px;height:28px;margin-left:8px;border-radius:8px;background:var(--accent);color:var(--accent-fg);vertical-align:middle}
.exname .vid{width:40px;height:32px;vertical-align:.15em}
.vidov{position:fixed;inset:0;z-index:40;background:rgba(10,14,18,.55);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vidbox{background:var(--surface);border-radius:14px;padding:16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.vidt{font-family:var(--display);font-size:1.4rem;font-weight:700;text-transform:uppercase;margin:0}
.vidx{width:40px;height:40px;border-radius:8px;background:var(--sunk);font-size:1.1rem;flex:none}
.vidc{width:100%;height:auto;aspect-ratio:5/4;max-width:100%;background:var(--bg);border-radius:10px;display:block}
.vidcue{margin:0;font-weight:500}.vidcap{margin:0;font-size:.85rem}
.exname @media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .25s linear}}
</style>

</head>
<body>
<div id="app"></div>

<div class="rotate" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg><b>Gira il telefono in verticale</b><span class="muted">Il timer continua a contare.</span></div>

<script src="anim.js"></script>
<script src="programs.js"></script>
<script>
/* ======= SCHEDE ======= */
const DEF_PROG="argento5";
function allProgs(){const extra=LS.get("pt-progs-extra",[]);const m=new Map();[...(window.PROGRAMS||[]),...extra].forEach(p=>m.set(p.id,p));return [...m.values()].sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0)}
let PROGS=[];
const progById=id=>PROGS.find(p=>p.id===id)||PROGS.find(p=>p.id===DEF_PROG)||PROGS[0];
const progOf=l=>progById((l&&l.prog)||DEF_PROG);
const planOf=l=>progOf(l).seds;
const exAll=sd=>sd?[...sd.ex,...(sd.old||[])]:[];
const isTendon=l=>(progOf(l).tendon||[]).includes(l.sed);
const calfOf=l=>progOf(l).calf||[];
let ACTIVE,PLAN,SEDS,TENDON,CALF;
function setActive(id){ACTIVE=progById(id);PLAN=ACTIVE.seds;SEDS=Object.keys(PLAN);TENDON={};(ACTIVE.tendon||[]).forEach(x=>TENDON[x]=1);CALF=ACTIVE.calf||[]}

const VIDICON='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2.5" fill="currentColor"/><path d="M17 10.5 22 7.5v9l-5-3z" fill="currentColor"/></svg>';
const ytLink=n=>window.ExAnim&&ExAnim.has(n)?`<span class="exn">${esc(n)}<button class="vid" data-act="vid" data-v="${esc(n)}" aria-label="Guarda l'esecuzione di ${esc(n)}">${VIDICON}</button></span>`:esc(n);
function cfg(ex,v){ // risolve serie/target/recupero per la variante
  const c={sets:ex.sets,rest:ex.rest,p:ex.p.map(x=>({...x}))};
  if(ex.var){const [s,r,rest]=ex.var[v||0];c.sets=s;c.rest=rest;c.p[0].v=r;}
  if(ex.leg){const b=c.p[0];c.p=[{...b,n:b.n+" DX",lab:"Destra",side:"dx"},{...b,n:b.n+" SX",lab:"Sinistra",side:"sx"}]}
  return c;
}
const exTitle=(ex,c)=>ex.leg?ex.p[0].n:c.p.map(p=>p.n).join(" + ");
const tgt=p=>p.k==="time"?(p.v>=60?p.v/60+"'":p.v+'"'):p.k==="max"?"max":p.v;
const tgtStr=(ex,c)=>c.sets+"×"+(ex.leg?tgt(c.p[0])+" per gamba":c.p.map(tgt).join("+"));
const STIFF=["nessuna","lieve","forte"];
function varLabel(sed,v){return PLAN[sed].ex.filter(e=>e.var).map(e=>{const c=cfg(e,v);return c.sets+"×"+c.p[0].v}).join(" · ")}

/* ======= FRASI ======= */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const LINES={
 start:["Telefono in tasca, testa qui. Si parte.","Non serve la voglia. Serve la prima serie.","Un'ora per te. Il resto aspetta.","Fai bene questa. La prossima viene da sé."],
 set:["Serie chiusa. Respira.","Bene. Recupera e non toccare il telefono.","Una in meno.","Così. Ora riposa davvero."],
 go:["Tempo. Sotto.","Si riparte.","Vai.","Carica e parti."],
 end:["Fatto. Questa conta più di quella perfetta che non hai fatto.","Seduta chiusa. La costanza la stai costruendo adesso.","Bravo. Ora mangia e dormi bene: è lì che cresci."]
};

/* ======= DATE ======= */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+"-W"+String(w).padStart(2,"0")}
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const fmtD=d=>new Date(d).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const kgf=n=>(Math.round(n*10)/10).toString().replace(".",",");

/* ======= STORAGE ======= */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let logs=LS.get("pt-logs",[]);
async function saveLog(l){logs=[...logs.filter(x=>x.id!==l.id),l];LS.set("pt-logs",logs)}
async function deleteLog(id){logs=logs.filter(x=>x.id!==id);LS.set("pt-logs",logs)}
const sorted=()=>[...logs].sort((a,b)=>new Date(b.date)-new Date(a.date));
PROGS=allProgs();
if(logs.some(l=>!l.prog)){logs=logs.map(l=>l.prog?l:{...l,prog:DEF_PROG});LS.set("pt-logs",logs)}
(function(){const d=LS.get("pt-draft",null);let id=d&&d.prog||LS.get("pt-prog",null);if(!id||progById(id).archived){const live=PROGS.filter(p=>!p.archived);const last=[...logs].filter(l=>!progOf(l).archived).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];id=last?last.prog:live[live.length-1].id}setActive(id);LS.set("pt-prog",ACTIVE.id)})();
/* migrazione una tantum: French press + EZ curl da "kg per lato" a "kg totali" (sedute prima del 2 novembre) */
(function(){if(LS.get("pt-mig-a7",false))return;let n=0;
  logs=logs.map(l=>{if((l.prog||DEF_PROG)!=="argento5"||!l.sets||!l.sets.a7||l.date>="2026-11-01T23:00:00.000Z")return l;
    n++;return {...l,sets:{...l.sets,a7:l.sets.a7.map(s=>s?{p:s.p.map(x=>({...x,kg:(x.kg||0)*2}))}:s)}}});
  if(n)LS.set("pt-logs",logs);LS.set("pt-mig-a7",true);
  const d=LS.get("pt-draft",null);if(d&&d.data&&d.data.a7&&d.start<"2026-11-01T23:00:00.000Z"){d.data.a7=d.data.a7.map(s=>s?{p:s.p.map(x=>({...x,kg:(x.kg||0)*2}))}:s);LS.set("pt-draft",d)}
})();
const NS=()=>SEDS.length;
const inActive=l=>progOf(l).id===ACTIVE.id;

/* ======= STATO ======= */
const S={view:"home",sel:null,v:null,w:LS.get("pt-draft",null),rest:null,work:null,wk:0,rpe:null,note:"",confirm:null,open:null};
function lastOf(sed){return sorted().find(l=>l.sed===sed&&inActive(l))}
function weekLogs(key){return logs.filter(l=>l.wk===key)}
function suggest(){const done=new Set(weekLogs(isoWeek(new Date())).filter(inActive).map(l=>l.sed));return SEDS.find(s=>!done.has(s))||null}
function nextVar(sed){const l=lastOf(sed);return l?1-(l.v||0):0}
function prevSets(sed,v,exId,beforeDate){
  const arr=sorted().filter(l=>l.sed===sed&&inActive(l)&&l.sets&&l.sets[exId]&&(!beforeDate||new Date(l.date)<new Date(beforeDate)));
  return (arr.find(l=>(l.v||0)===v)||arr[0]||null);
}
function saveDraft(){if(S.w)LS.set("pt-draft",S.w);else LS.del("pt-draft")}

/* ======= AUDIO / VIBRA / WAKE ======= */
let ac=null,wake=null,wakeOk=null,sndEnd=null,sndTick=null;
/* WAV generato al volo: un <audio> suona anche con l'interruttore silenzioso dell'iPhone, a differenza del Web Audio */
function wav(tones){
  const rate=22050,gap=.08;let total=0;tones.forEach(t=>total+=t[1]+gap);
  const n=Math.floor(total*rate),buf=new ArrayBuffer(44+n*2),d=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
  ws(0,"RIFF");d.setUint32(4,36+n*2,true);ws(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
  d.setUint32(24,rate,true);d.setUint32(28,rate*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);ws(36,"data");d.setUint32(40,n*2,true);
  let i=0;tones.forEach(([f,dur])=>{const len=Math.floor(dur*rate);for(let k=0;k<len&&i<n;k++,i++){const env=Math.min(1,k/200,(len-k)/400);d.setInt16(44+i*2,Math.sin(2*Math.PI*f*k/rate)*env*26000,true)}const g=Math.floor(gap*rate);for(let k=0;k<g&&i<n;k++,i++)d.setInt16(44+i*2,0,true)});
  let s="";const u=new Uint8Array(buf);for(let k=0;k<u.length;k+=8192)s+=String.fromCharCode.apply(null,u.subarray(k,k+8192));
  return "data:audio/wav;base64,"+btoa(s);
}
/* iOS 16.4+: sessione audio "transient" = il beep abbassa la musica per un attimo invece di fermarla */
const MIX=(()=>{try{if(navigator.audioSession){navigator.audioSession.type="transient";return true}}catch{}return false})();
function prime(a){if(!a||a._primed)return;try{a.muted=true;const p=a.play();if(p&&p.then)p.then(()=>{a.pause();a.currentTime=0;a.muted=false;a._primed=true}).catch(()=>{a.muted=false})}catch{}}
function unlockAudio(){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch{}
  if(!MIX)return; /* senza Audio Session il tag <audio> fermerebbe Amazon Music: uso solo Web Audio */
  try{if(!sndEnd){sndEnd=new Audio(wav([[880,.22],[880,.22],[1320,.45]]));sndTick=new Audio(wav([[660,.15]]));sndEnd.preload=sndTick.preload="auto"}prime(sndEnd);prime(sndTick)}catch{}
}
function beep(n=3,f=880){
  try{if(MIX&&navigator.audioSession.type!=="transient")navigator.audioSession.type="transient"}catch{}
  const a=MIX?(n>1?sndEnd:sndTick):null;
  try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200,100,400]:[120])}catch{}
  if(a){try{a.muted=false;a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>webBeep(n,f));return}catch{}}
  webBeep(n,f);
}
function webBeep(n,f){try{if(!ac)return;if(ac.state==="suspended")ac.resume();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i===n-1?f*1.5:f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.24)}}catch{}}
async function keepAwake(){try{if(!navigator.wakeLock){wakeOk=false;return}if(!wake){wake=await navigator.wakeLock.request("screen");wakeOk=true;wake.addEventListener("release",()=>wake=null)}}catch{wakeOk=false}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){try{ac&&ac.state==="suspended"&&ac.resume()}catch{}if(S.w)keepAwake()}});
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}

/* ======= WORKOUT LOGIC ======= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* incrementi reali in palestra: cavi, leg extension e leg curl 5 kg · manubri 2,5 kg per manubrio · bilanciere 2,5 kg totali (dischi da 1,25) · leg press 2,5 kg */
const STEPCAT=[
 {k:"cavi",lab:"Cavi",ex:"pulley, low row, lat machine, vertical traction, alzata laterale, croci ai cavi, push down",re:/cavo|cavi|pulley|lat machine|low row|vertical traction|push down/i,d:5},
 {k:"legmac",lab:"Leg extension e leg curl",ex:"pacco pesi",re:/leg extension|leg curl/i,d:5},
 {k:"legpress",lab:"Leg press",ex:"leg press e leg press basculante",re:/leg press/i,d:2.5},
 {k:"bil",lab:"Bilanciere",ex:"panca, rematore, spinte in alto, stacchi, French press, EZ curl (kg totali)",re:/bilanciere|multipower|french press|ez curl/i,d:2.5},
 {k:"man",lab:"Manubri",ex:"per manubrio: croci, curl, spinte, stacchi, goblet, bulgarian, calf",re:/./,d:2.5}];
const STEPOPT=[1,1.25,2,2.5,5];
function stepCat(name){return STEPCAT.find(c=>c.re.test(name))}
function stepFor(name,kg){const c=stepCat(name);const st=LS.get("pt-steps",{});return st[c.k]||c.d}
/* prossimo / precedente peso realizzabile sulla griglia dell'attrezzo (es. 23 → 25 su un pacco da 5) */
const gridUp=(kg,st)=>Math.round(Math.ceil((kg+0.001)/st)*st*100)/100;
const gridDown=(kg,st)=>Math.max(0,Math.round(Math.floor((kg-0.001)/st)*st*100)/100);
/* ======= OBIETTIVO DI OGGI (dall'ultima volta) ======= */
function tendonWarnNow(){
  const m=monday(new Date());const cur=tendonStats(m);if(cur.wl.length)return cur.warn;
  const p=new Date(m);p.setDate(p.getDate()-7);return tendonStats(p).warn;
}
function suggFor(w,ex){
  const prev=prevSets(w.sed,w.v,ex.id);if(!prev)return null;
  if(ex.var&&(prev.v||0)!==(w.v||0))return null;
  const c=cfg(ex,w.v),sets=prev.sets[ex.id].filter(Boolean);if(!sets.length)return null;
  const parts=[],info=[];const step=stepFor(ex.p[0].n);const side=j=>ex.leg?(j===0?"DX: ":"SX: "):(c.p.length>1?c.p[j].n+": ":"");
  c.p.forEach((p,j)=>{
    if(p.k==="max"){const tot=sets.reduce((a,s)=>a+(s.p[j]?.r||0),0);if(tot)parts.push({j,kind:"reps",tot,text:`${side(j)}l'ultima volta ${tot} reps totali. Oggi fanne almeno ${tot+1}.`,short:`almeno ${tot+1} reps totali`});return}
    if(!p.kg)return;
    const kgs=sets.map(s=>s.p[j]?.kg||0);const maxKg=Math.max(...kgs);if(!maxKg)return;
    const goal=p.v;const hit=sets.length>=c.sets&&sets.every(s=>(s.p[j]?.r||0)>=goal);
    const missed=sets.reduce((a,s)=>a+Math.max(0,goal-(s.p[j]?.r||0)),0)+Math.max(0,c.sets-sets.length)*goal;
    const unit=p.k==="time"?'"':" reps";
    if(hit&&CALF.includes(ex.id)&&tendonWarnNow()){parts.push({j,kind:"info",text:`${side(j)}avresti chiuso tutto a ${kgf(maxKg)} kg, ma il tendine è sopra la tua media: resta a ${kgf(maxKg)} kg.`,short:`resta a ${kgf(maxKg)} kg`});return}
    const nTop=sets.filter(s=>(s.p[j]?.kg||0)>=maxKg-0.01).length;
    if(hit&&nTop<Math.ceil(c.sets*0.75)){
      const cnt={};kgs.forEach(k=>cnt[k]=(cnt[k]||0)+1);const srt=[...kgs].sort((a,b)=>a-b);
      const rep2=Object.keys(cnt).filter(k=>cnt[k]>1);
      /* peso più usato; se ogni serie ha un peso diverso (piramide) uso quello centrale */
      const mode=rep2.length?+rep2.sort((a,b)=>cnt[b]-cnt[a]||b-a)[0]:srt[Math.floor((srt.length-1)/2)];
      const st=stepFor(p.n);let to=Math.min(gridUp(mode,st),maxKg);if(Math.abs(to/st-Math.round(to/st))>1e-6)to=gridDown(to,st);
      parts.push({j,kind:"up",kg:to,text:`${side(j)}l'ultima volta hai cambiato peso tra le serie (${kgs.map(kgf).join(" · ")}). Oggi tutte le serie a ${kgf(to)} kg: il riscaldamento fallo prima, fuori conteggio.`,short:`${side(j)}tutte a ${kgf(to)} kg`});return}
    if(hit){const to=gridUp(maxKg,stepFor(p.n,maxKg));parts.push({j,kind:"up",kg:to,text:`${side(j)}l'ultima volta hai chiuso tutte le serie a ${kgf(maxKg)} kg. Oggi prova ${kgf(to)} kg.`,short:`${side(j)}${kgf(to)} kg`});return}
    if(missed>0)parts.push({j,kind:"hold",kg:maxKg,goal,text:`${side(j)}l'ultima volta ti sono mancate ${missed}${unit} a ${kgf(maxKg)} kg. Resta a ${kgf(maxKg)} kg e chiudi tutte le serie.`,short:`${side(j)}chiudi tutto a ${kgf(maxKg)} kg`});
    const hist=sorted().filter(x=>x.sed===w.sed&&inActive(x)&&(x.v||0)===(w.v||0)&&x.sets&&x.sets[ex.id]).slice(0,3);
    if(!hit&&hist.length===3){const m=hist.map(x=>Math.max(...x.sets[ex.id].filter(Boolean).map(s=>s.p[j]?.kg||0)));if(m.every(v=>v===m[0]))info.push(`Fermo a ${kgf(m[0])} kg da 3 sedute: allunga il recupero di 15".`)}
  });
  if(ex.leg&&c.p[0].kg){const dx=legMetric(sets,0,c.p[0]),sx=legMetric(sets,1,c.p[1]);if(dx&&sx){const pct=Math.round((sx-dx)/Math.max(sx,dx)*100);if(pct>=10)info.push(`Il destro è sotto del ${pct}%: porta su il destro, non abbassare il sinistro.`)}}
  if(!parts.length&&!info.length)return null;
  return {parts,info,hit:{}};
}
function getSugg(ex){const w=S.w;w.sugg=w.sugg||{};if(!(ex.id in w.sugg))w.sugg[ex.id]=suggFor(w,ex);return w.sugg[ex.id]}
function suggActive(ex){const w=S.w;const sg=getSugg(ex);return sg&&!(w.suggOk||{})[ex.id]?sg:null}
function checkSugg(ex,entry){
  const w=S.w,sg=suggActive(ex);if(!sg)return;
  const actionable=sg.parts.filter(p=>p.kind!=="info");
  if(!actionable.length){(w.suggOk=w.suggOk||{})[ex.id]=true;return}
  actionable.forEach(p=>{const x=entry.p[p.j];if(!x)return;
    if(p.kind==="up"&&x.kg>=p.kg-0.01)sg.hit[p.j]=true;
    if(p.kind==="hold"&&x.kg>=p.kg-0.01&&x.r>=p.goal){const done=(w.data[ex.id]||[]).filter(Boolean);if(done.length>=cfg(ex,w.v).sets&&done.every(s=>(s.p[p.j]?.r||0)>=p.goal))sg.hit[p.j]=true}
    if(p.kind==="reps"){const tot=(w.data[ex.id]||[]).filter(Boolean).reduce((a,s)=>a+(s.p[p.j]?.r||0),0);if(tot>p.tot)sg.hit[p.j]=true}
  });
  if(actionable.every(p=>sg.hit[p.j])){(w.suggOk=w.suggOk||{})[ex.id]=true;setTimeout(()=>toast("Obiettivo raggiunto. Bravo."),400)}
}
function suggCard(ex){
  const sg=suggActive(ex);if(!sg)return "";
  return `<div class="sugg"><div class="spread"><span class="eyebrow" style="color:inherit">Obiettivo di oggi</span><button data-act="suggok" data-v="${ex.id}" aria-label="Nascondi obiettivo">✕</button></div>
    ${sg.parts.map(p=>`<p>${esc(p.text.charAt(0).toUpperCase()+p.text.slice(1))}</p>`).join("")}${sg.info.map(t=>`<p class="si">${esc(t)}</p>`).join("")}</div>`;
}

function prefill(){
  const w=S.w,ex=PLAN[w.sed].ex[w.i],c=cfg(ex,w.v);
  const mine=w.data[ex.id]||[];
  const prev=prevSets(w.sed,w.v,ex.id);
  const pv=prev?prev.sets[ex.id]:null;const sg=suggActive(ex);
  w.cur=c.p.map((p,j)=>{
    const fromMine=mine[w.s-1]&&mine[w.s-1].p[j];
    const fromPrev=pv&&(pv[w.s]||pv[pv.length-1]);const pp=fromPrev&&fromPrev.p[j];
    const up=sg&&sg.parts.find(x=>x.j===j&&x.kind==="up");
    const kg=fromMine?fromMine.kg:(up?up.kg:(pp?pp.kg:""));
    const r=p.k==="max"?(pp?pp.r:""):p.v;
    return {kg:p.kg?kg:"",r};
  });
}
function startWorkout(){
  unlockAudio();keepAwake();
  S.w={prog:ACTIVE.id,sed:S.sel,v:S.v,start:new Date().toISOString(),i:0,s:0,data:{},line:pick(LINES.start)};
  prefill();S.view="work";saveDraft();render();window.scrollTo(0,0);
}
const curArr=()=>S.edit?S.edit.cur:S.w.cur;
const viewIdx=()=>S.edit?S.edit.i:S.w.i;
function backToRest(){if(S.rest&&S.rest.hidden){S.rest.hidden=false;if(S.rest.end<=Date.now())S.rest.end=Date.now()+50}}
function startEdit(i,k){
  const w=S.w,ex=PLAN[w.sed].ex[i],d=(w.data[ex.id]||[])[k];if(!d)return;
  S.edit={i,s:k,cur:d.p.map(p=>({kg:p.kg||"",r:p.r}))};S.work=null;render();window.scrollTo(0,0);
}
function saveEdit(){
  const w=S.w,e=S.edit,ex=PLAN[w.sed].ex[e.i],c=cfg(ex,w.v);
  w.data[ex.id][e.s]={p:e.cur.map((x,j)=>({kg:c.p[j].kg?(parseFloat(String(x.kg).replace(",","."))||0):0,r:parseFloat(String(x.r).replace(",","."))||0}))};
  S.edit=null;if(e.i===w.i&&e.s===w.s-1)prefill();saveDraft();toast(`Serie ${e.s+1} corretta`);backToRest();render();window.scrollTo(0,0);
}
function logSet(){
  unlockAudio();
  if(S.edit){saveEdit();return}
  const w=S.w,ex=PLAN[w.sed].ex[w.i],c=cfg(ex,w.v);
  if(!S.kgWarn&&c.p.some((p,j)=>p.kg&&p.k!=="time"&&!(parseFloat(String(w.cur[j].kg).replace(",","."))>0))){S.kgWarn=true;toast("Kg vuoti: scrivi il peso. Se è a corpo libero tocca di nuovo.");return}
  S.kgWarn=false;
  w.last={i:w.i,s:w.s};
  const entry={p:w.cur.map((x,j)=>({kg:c.p[j].kg?(parseFloat(String(x.kg).replace(",","."))||0):0,r:parseFloat(String(x.r).replace(",","."))||0}))};
  (w.data[ex.id]=w.data[ex.id]||[])[w.s]=entry;
  checkSugg(ex,entry);
  S.work=null;
  const lastSet=w.s>=c.sets-1, lastEx=w.i>=PLAN[w.sed].ex.length-1;
  if(lastSet&&lastEx){saveDraft();goFinish();return}
  if(lastSet){w.i++;w.s=0}else{w.s++}
  prefill();saveDraft();
  if(c.rest>0){startRest(c.rest,lastSet)}else{render();window.scrollTo(0,0)}
}
function startRest(sec,newEx){S.rest={end:Date.now()+sec*1000,total:sec,newEx,line:pick(LINES.set),fired:false};render()}
function goFinish(){S.endConfirm=false;S.rest=null;S.work=null;S.view="finish";S.rpe=null;S.pain=null;S.note="";render();window.scrollTo(0,0)}
async function finish(){

  {const h=numP(S.whr);if(h!=null)l.watch={hr:h}}

/* ======= APPLE WATCH (dati passati dal comando di iOS via URL) ======= */
const numP=v=>{if(v==null||v==="")return null;const n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:null};
function readWatchURL(){
  try{const q=new URLSearchParams(location.search);if(!q.has("watch"))return null;
    let st=q.get("start");let d=st?new Date(st.replace(" ","T")):new Date();if(isNaN(d))d=new Date();
    const p={start:d.toISOString(),min:numP(q.get("min")),kcal:numP(q.get("kcal")),hr:numP(q.get("hr")),hrmax:numP(q.get("hrmax")),got:new Date().toISOString()};
    history.replaceState(null,"",location.pathname);
    if(p.min==null&&p.kcal==null&&p.hr==null)return null;
    const pend=LS.get("pt-watch",[]);pend.push(p);LS.set("pt-watch",pend);return p}catch{return null}
}
function attachWatch(){
  let pend=LS.get("pt-watch",[]);if(!pend.length)return [];
  const attached=[];const keep=[];
  pend.forEach(p=>{const t=new Date(p.start).getTime();
    let best=null,bd=1e15;logs.forEach(l=>{const dd=Math.abs(new Date(l.date).getTime()-t);if(dd<4*36e5&&dd<bd){bd=dd;best=l}});
    if(best){best.watch={min:p.min,kcal:p.kcal,hr:p.hr,hrmax:p.hrmax,start:p.start};attached.push([p,best])}
    else if(Date.now()-new Date(p.got).getTime()<2*864e5)keep.push(p);
  });
  if(attached.length)LS.set("pt-logs",logs);
  LS.set("pt-watch",keep);return attached;
}
function parseWatchText(t){
  try{t=String(t||"").trim();const i=t.indexOf("watch=");if(i<0)return null;const q=new URLSearchParams(t.slice(i).split(/[\s]/)[0]);
    let st=q.get("start");let d=st?new Date(st.replace(" ","T")):new Date();if(isNaN(d))d=new Date();
    const p={start:d.toISOString(),min:numP(q.get("min")),kcal:numP(q.get("kcal")),hr:numP(q.get("hr")),hrmax:numP(q.get("hrmax"))};
    return (p.kcal==null&&p.hr==null&&p.min==null)?null:p}catch{return null}
}
async function pasteWatch(logId){
  let txt=null;try{txt=await navigator.clipboard.readText()}catch{}
  const p=parseWatchText(txt);
  if(!p){S.watchPaste=logId;render();toast("Non trovo i dati negli appunti: incollali nel campo");return}
  applyWatch(logId,p);
}
function watchPasteUI(l){
  if(S.watchPaste!==l.id)return `<button class="btn btn-ghost" data-act="wedit" data-v="${l.id}">${l.watch&&l.watch.hr!=null?"Modifica battiti medi":"Aggiungi battiti medi"}</button>`;
  const w=l.watch||{};
  return `<div class="fields one"><div class="fld"><label for="hhr">FC media (bpm)</label><input id="hhr" class="winp" inputmode="numeric" value="${w.hr??""}"></div></div><button class="btn btn-primary" data-act="wsave" data-v="${l.id}">Salva battiti</button>`;
}
function applyWatch(logId,p){
  const l=logs.find(x=>x.id===logId);if(!l)return;
  const nl={...l,watch:{min:p.min,kcal:p.kcal,hr:p.hr,hrmax:p.hrmax,start:p.start}};saveLog(nl);S.watchPaste=null;S.watchTxt="";
  toast(`Dati Apple Watch aggiunti: ${watchTxt(nl.watch)}`);render();
}
function hrWeek(key){
  const hrs=weekLogs(key).map(l=>l.watch&&l.watch.hr).filter(x=>x!=null);
  const [y,w]=key.split("-W").map(Number);const d=new Date(y,0,4);const m=monday(d);m.setDate(m.getDate()+(w-1)*7-7);
  const ph=weekLogs(isoWeek(m)).map(l=>l.watch&&l.watch.hr).filter(x=>x!=null);
  return {avg:mean(hrs),n:hrs.length,prev:mean(ph)};
}
const watchTxt=w=>w&&w.hr!=null?"FC media "+Math.round(w.hr)+" bpm":"";
function onWatchArrive(){
  const p=readWatchURL();const att=attachWatch();
  if(p){const a=att.find(x=>x[0]===p);setTimeout(()=>toast(a?`Dati Apple Watch agganciati alla seduta ${a[1].sed}: ${watchTxt(p)}`:`Dati Apple Watch ricevuti: si agganciano quando salvi la seduta`),500)}
}

/* ======= ANALISI SETTIMANALE ======= */
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function legMetric(sets,j,p){return sets.reduce((a,s)=>{const x=s&&s.p[j];if(!x)return a;return a+(p.kg&&x.kg?x.kg*(p.k==="time"?1:(x.r||0)):(x.r||0))},0)}
function tendonStats(mon){
  const key=isoWeek(mon);
  const wl=weekLogs(key).filter(isTendon);
  const pains=wl.map(l=>l.pain).filter(x=>typeof x==="number");
  const avg=mean(pains),max=pains.length?Math.max(...pains):null;
  const prevK=[1,2,3,4].map(i=>{const d=new Date(mon);d.setDate(d.getDate()-7*i);return isoWeek(d)});
  const baseAvg=mean(logs.filter(l=>prevK.includes(l.wk)&&typeof l.pain==="number").map(l=>l.pain));
  const stiffs=wl.map(l=>l.stiff).filter(x=>typeof x==="number"&&x>=0);
  const asym=[];
  const acc=new Map();
  wl.forEach(l=>{const sd=planOf(l)[l.sed];if(!sd)return;exAll(sd).filter(e=>e.leg).forEach(ex=>{const s=l.sets&&l.sets[ex.id];if(!s)return;const c=cfg(ex,0);
    const o=acc.get(ex.p[0].n)||{dx:0,sx:0,kg:ex.p[0].kg};o.dx+=legMetric(s,0,c.p[0]);o.sx+=legMetric(s,1,c.p[1]);acc.set(ex.p[0].n,o)})});
  acc.forEach((o,n)=>{if(o.dx>0&&o.sx>0)asym.push({n,pct:Math.round((o.sx-o.dx)/Math.max(o.sx,o.dx)*100),unit:o.kg?"carico":"reps"})});
  const msgs=[];let warn=false;
  if(wl.length){
    if(!pains.length)msgs.push(["warn","Dolore non registrato","Senza il numero non vediamo la tendenza. Segnalo a fine seduta."]);
    else if(baseAvg==null)msgs.push(["push",`Prima misura: dolore medio ${kgf(avg)}`,"Questo diventa il tuo riferimento. Dalla prossima settimana ti confronto con la tua media delle ultime 4."]);
    else{const d=avg-baseAvg;
      if(d>=1.5){warn=true;msgs.push(["warn",`Dolore in salita: ${kgf(avg)} contro media ${kgf(baseAvg)}`,"Questa settimana non aumentare i carichi su polpacci, salti e isometrie. Torna a spingere quando rientra nella media."])}
      else if(d<=-1)msgs.push(["good",`Dolore in calo: ${kgf(avg)} (media ${kgf(baseAvg)})`,"Il tendine sta reggendo il lavoro. Puoi progredire dove chiudi tutte le reps."]);
      else msgs.push(["good",`Dolore stabile: ${kgf(avg)} (media ${kgf(baseAvg)})`,"Stabile va bene: il carico attuale è tollerato."]);
      if(max-baseAvg>=3)msgs.push(["warn",`Picco a ${max} in una seduta`,"Guarda nello Storico quale: di solito è l'esercizio con il salto di carico più grande."])}
    const strong=stiffs.filter(x=>x===2).length,light=stiffs.filter(x=>x===1).length;
    if(strong){warn=true;msgs.push(["bad",`Rigidità forte al mattino ${strong} ${strong>1?"volte":"volta"}`,"È il segnale più importante. Se si ripete la settimana prossima, parlane col fisio prima di caricare ancora."])}
    else if(light>=2)msgs.push(["warn",`Rigidità lieve ${light} mattine`,"Da tenere d'occhio. Se diventa la norma, scala i saltelli."]);
    else if(stiffs.length)msgs.push(["good","Mattine senza rigidità rilevante","Il recupero tra una seduta e l'altra funziona."]);
    asym.forEach(a=>{
      if(a.pct>=10)msgs.push(["warn",`${a.n}: destro sotto del ${a.pct}%`,`Differenza di ${a.unit} tra le gambe. Il riferimento comune è stare entro il 10%: porta su il destro, non abbassare il sinistro.`]);
      else if(a.pct<=-10)msgs.push(["push",`${a.n}: sinistro sotto del ${-a.pct}%`,"Insolito dopo un infortunio al destro: controlla di non sovraccaricare il destro."]);
      else msgs.push(["good",`${a.n}: dx e sx allineati (${a.pct>0?"−":"+"}${Math.abs(a.pct)}% dx)`,"Entro il 10%."]);
    });
  }
  return{wl,avg,max,baseAvg,stiffs,asym,msgs,warn};
}
function analyze(key,tw){
  const wl=weekLogs(key).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const msgs=[];const live=wl.filter(l=>inActive(l));const done=new Set(live.map(l=>l.sed));
  const isNow=key===isoWeek(new Date());
  const miss=SEDS.filter(s=>!done.has(s));
  const arch=wl.filter(l=>progOf(l).archived);
  if(arch.length&&arch.length===wl.length)msgs.push(["good",`${wl.length} ${wl.length===1?"seduta":"sedute"} · ${progOf(arch[0]).name}`,"Settimana registrata prima dell'app: conta per la costanza, i carichi non vengono analizzati."]);
  else if(wl.length>=NS())msgs.push(["good",`Settimana completa: ${NS()} su ${NS()}`,"È questo che fa la differenza, non il carico di una singola seduta."]);
  else if(isNow){const left=7-((new Date().getDay()+6)%7);msgs.push([wl.length?"push":"warn",`Sei a ${wl.length} su ${NS()}`,`Mancano ${miss.join(", ")}. Restano ${left} giorni compreso oggi${miss.length>left?": tutte non ci stanno, scegli le più importanti (B e D sono le gambe)":""}.`])}
  else if(wl.length)msgs.push([wl.length>=3?"warn":"bad",`${wl.length} ${wl.length===1?"seduta":"sedute"} su ${NS()}`,`Saltate: ${miss.join(", ")}.${miss.some(s=>s==="B"||s==="D")?" Le sedute di gambe sono quelle che hai mollato: è lì che rischi di restare indietro.":""}`]);
  const vol=l=>{let v=0;for(const id in l.sets||{})(l.sets[id]||[]).forEach(s=>s&&s.p.forEach(p=>{v+=(p.kg||0)*(p.r||0)}));return v};
  const totVol=wl.reduce((a,l)=>a+vol(l),0);
  const rpes=wl.map(l=>l.rpe).filter(Boolean);const avgRpe=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
  if(avgRpe!==null){if(avgRpe>=9)msgs.push(["warn","Fatica alta (RPE medio "+kgf(avgRpe)+")","Se dura più di 2 settimane, dormi di più o togli una serie agli accessori."]);
    else if(avgRpe<=6)msgs.push(["push","Troppo comodo (RPE medio "+kgf(avgRpe)+")","Hai margine: alza i carichi dove chiudi tutte le reps."])}
  wl.forEach(l=>{
    (progOf(l).archived?[]:exAll(planOf(l)[l.sed])).forEach(ex=>{
      const got=l.sets&&l.sets[ex.id];if(!got)return;const c=cfg(ex,l.v||0);
      const sets=got.filter(Boolean);
      if(sets.length<c.sets&&c.sets>1)msgs.push(["warn",`${ex.p[0].n}: ${sets.length}/${c.sets} serie`,"Hai tagliato serie. Se succede spesso, dimmelo e rivediamo il volume."]);
      c.p.forEach((p,j)=>{
        if(p.k==="max"){const tot=sets.reduce((a,s)=>a+(s.p[j]?.r||0),0);const pr=prevSets(l.sed,l.v||0,ex.id,l.date);
          if(pr){const pt=pr.sets[ex.id].filter(Boolean).reduce((a,s)=>a+(s.p[j]?.r||0),0);if(tot>pt)msgs.push(["good",`${p.n}: ${tot} reps totali`,`Erano ${pt}. Su.`]);else if(tot<pt)msgs.push(["warn",`${p.n}: ${tot} reps (prima ${pt})`,"Calo. Guarda recupero e sonno."])}
          return}
        if(p.k!=="reps"||!p.kg)return;
        const kgs=sets.map(s=>s.p[j]?.kg||0);const maxKg=Math.max(...kgs);if(!maxKg)return;
        const hit=sets.length>=c.sets&&sets.every(s=>(s.p[j]?.r||0)>=p.v);
        const missed=sets.reduce((a,s)=>a+Math.max(0,p.v-(s.p[j]?.r||0)),0);
        const pr=prevSets(l.sed,l.v||0,ex.id,l.date);
        const prMax=pr?Math.max(...pr.sets[ex.id].filter(Boolean).map(s=>s.p[j]?.kg||0)):null;
        const lbl=ex.var?` (${c.sets}×${p.v})`:"";
        if(hit&&tw&&tw.warn&&calfOf(l).includes(ex.id))msgs.push(["warn",`${p.n}: tutto chiuso a ${kgf(maxKg)} kg`,"Saliresti di carico, ma il tendine questa settimana è sopra la tua media. Resta qui."]);
        else if(hit&&sets.filter(s=>(s.p[j]?.kg||0)>=maxKg-0.01).length<Math.ceil(c.sets*0.75))msgs.push(["push",`${p.n}${lbl}: peso cambiato tra le serie (${kgs.map(kgf).join(" · ")})`,`Prossima volta un solo peso per tutte le serie, riscaldamento fuori conteggio.`]);
        else if(hit)msgs.push(["push",`${p.n}${lbl}: tutto chiuso a ${kgf(maxKg)} kg`,`Prossima volta ${kgf(gridUp(maxKg,stepFor(p.n)))} kg.`]);
        else if(missed>c.sets)msgs.push(["warn",`${p.n}${lbl}: ${missed} reps mancate a ${kgf(maxKg)} kg`,"Resta su questo carico finché non le chiudi tutte. Non salire."]);
        if(prMax!==null&&maxKg<prMax)msgs.push(["bad",`${p.n}: calato da ${kgf(prMax)} a ${kgf(maxKg)} kg`,"Se non era voluto, capisci perché: sonno, recupero, fretta."]);
        const hist=sorted().filter(x=>x.sed===l.sed&&(x.v||0)===(l.v||0)&&x.sets&&x.sets[ex.id]&&new Date(x.date)<=new Date(l.date)).slice(0,3);
        if(hist.length===3&&!hit){const m=hist.map(x=>Math.max(...x.sets[ex.id].filter(Boolean).map(s=>s.p[j]?.kg||0)));if(m.every(v=>v===m[0]))msgs.push(["bad",`${p.n}: fermo a ${kgf(m[0])} kg da 3 sedute`,"Stallo. Prova ad allungare il recupero di 15\" o a fare una serie in meno ma piena."])}
      });
    });
  });
  const order={bad:0,warn:1,push:2,good:3};
  return{wl,msgs:[msgs[0],...msgs.slice(1).sort((a,b)=>order[a[0]]-order[b[0]])].filter(Boolean),totVol,avgRpe,done};
}

function setsTxt(ex,c,arr){return arr.filter(Boolean).map(s=>s.p.map((p,j)=>{const q=c.p[j]||{};const kg=q.kg&&p.kg?kgf(p.kg)+"kg ":"";return q.k==="time"?kg+(p.r>=60?mmss(p.r):p.r+'"'):kg+(kg?"×":"")+p.r}).join(ex.leg?" | ":" + ")).join(", ")+(ex.leg?"  (dx | sx)":"")}
function buildReport(key){
  const mon=(()=>{const [y,w]=key.split("-W").map(Number);const d=new Date(y,0,4);const m=monday(d);m.setDate(m.getDate()+(w-1)*7);return m})();
  const end=new Date(mon);end.setDate(end.getDate()+6);
  const tw=tendonStats(mon),a=analyze(key,tw);
  const L=[];
  L.push(`COACHING PT GIO · report settimana ${key.split("-W")[1]} (${mon.toLocaleDateString("it-IT",{day:"numeric",month:"short"})} – ${end.toLocaleDateString("it-IT",{day:"numeric",month:"short"})})`);
  L.push(`Scheda: ${ACTIVE.name}`);L.push(`Sedute: ${a.wl.length}/${NS()} (${a.wl.map(l=>l.sed).join(", ")||"nessuna"}) · RPE medio ${a.avgRpe?kgf(a.avgRpe):"–"} · tonnellaggio ${a.totVol?Math.round(a.totVol)+" kg":"–"}`);
  {const it=hrWeek(key);if(it.avg!=null)L.push(`Intensità: FC media ${Math.round(it.avg)} bpm su ${it.n} sedute${it.prev!=null?" (settimana prima "+Math.round(it.prev)+")":""}`)}
  L.push(`Tendine dx: dolore medio ${tw.avg!=null?kgf(tw.avg):"–"} (media 4 sett. prima ${tw.baseAvg!=null?kgf(tw.baseAvg):"–"}) · rigidità ${tw.stiffs.length?tw.stiffs.map(x=>STIFF[x]).join("/"):"non segnata"}`);
  tw.asym.forEach(x=>L.push(`  ${x.n}: ${x.pct===0?"dx e sx pari":x.pct>0?"dx sotto sx del "+x.pct+"%":"dx sopra sx del "+(-x.pct)+"%"}`));
  a.wl.forEach(l=>{
    L.push("");
    const PL=planOf(l);if(!PL[l.sed])return;
    L.push(`SEDUTA ${l.sed}${progOf(l).id!==ACTIVE.id?" ("+progOf(l).name+")":""}${PL[l.sed].ex.some(e=>e.var)?" var."+((l.v||0)+1):""} · ${fmtD(l.date)} · ${l.dur!=null?l.dur:"–"}' · RPE ${l.rpe||"–"}${typeof l.pain==="number"?" · dolore "+l.pain:""}${typeof l.stiff==="number"&&l.stiff>=0?" · rigidità "+STIFF[l.stiff]:""}`);
    exAll(PL[l.sed]).forEach(ex=>{const s=l.sets&&l.sets[ex.id];const c=cfg(ex,l.v||0);if(!s&&((PL[l.sed].old||[]).includes(ex)||(ex.since&&l.date.slice(0,10)<ex.since)))return;
      if(!s){L.push(`  ${exTitle(ex,c)}: saltato`);return}
      L.push(`  ${exTitle(ex,c)} (${tgtStr(ex,c)}): ${setsTxt(ex,c,s)}`)});
    if(l.watch&&l.watch.hr!=null)L.push(`  ${watchTxt(l.watch)}`);
    if(l.note)L.push(`  Note: ${l.note}`);
  });
  if(a.msgs.length||tw.msgs.length){L.push("");L.push("Segnalazioni dell'app:");[...tw.msgs,...a.msgs].forEach(m=>L.push(`  - ${m[1]}`))}
  L.push("");L.push("Fammi il check settimanale: cosa va bene, cosa cambiare, carichi della prossima settimana.");
  return L.join("\n");
}

/* stima durata seduta: lavoro + recuperi + cambio attrezzo; se ci sono sedute vere uso la loro media */
function estMin(sed){
  const real=sorted().filter(l=>l.sed===sed&&inActive(l)&&l.dur>=15).slice(0,3).map(l=>l.dur);
  if(real.length)return {m:Math.round(mean(real)/5)*5,real:true};
  const v=nextVar(sed);let sec=0;
  PLAN[sed].ex.forEach(ex=>{const c=cfg(ex,v);
    const per=ex.p.reduce((a,p)=>a+(p.k==="time"?p.v:p.k==="max"?30:Math.max(20,(c.p.find(q=>q.n.startsWith(p.n))||p).v*3.5)),0)*(ex.leg||ex.side?2:1);
    sec+=c.sets*per+Math.max(0,c.sets-1)*(c.rest||0)+(ex.free?0:60);
  });
  return {m:Math.max(5,Math.round(sec/60/5)*5),real:false};
}

function renderWeek(){
  const m=monday(new Date());m.setDate(m.getDate()+S.wk*7);const key=isoWeek(m);
  const end=new Date(m);end.setDate(end.getDate()+6);
  const W=320;
  const tw=tendonStats(m);
  const a=analyze(key,tw);
  const pw=[];for(let i=7;i>=0;i--){const d=new Date(m);d.setDate(d.getDate()-7*i);const k=isoWeek(d);pw.push({k,v:mean(weekLogs(k).map(l=>l.pain).filter(x=>typeof x==="number"))})}

function mdLite(t){
  let h=esc(t);
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const lines=h.split("\n");let out="",inList=false;
  lines.forEach(l=>{const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){if(!inList){out+="<ul>";inList=true}out+=`<li>${m[1]}</li>`}
    else{if(inList){out+="</ul>";inList=false}if(/^#{1,4}\s/.test(l))out+=`<p><b>${l.replace(/^#{1,4}\s/,"")}</b></p>`;else if(l.trim())out+=`<p>${l}</p>`}});
  if(inList)out+="</ul>";return out;
}
async function sendChat(text){
  text=(text||"").trim();if(!text||chatBusy)return;
  if(!chatKey()){toast("Inserisci prima la chiave API nelle Impostazioni");S.view="settings";render();return}
  if(!navigator.onLine){toast("Sei offline: il coach risponde solo con internet");return}
  chatMsgs.push({role:"user",content:text,t:Date.now()});const ans={role:"assistant",content:"",t:Date.now()};chatMsgs.push(ans);
  chatBusy=true;S.chatDraft="";saveChat();render();scrollChat();
  const history=chatMsgs.slice(0,-1).filter(m=>m.content).slice(-14).map(m=>({role:m.role,content:m.content}));
  while(history.length&&history[0].role!=="user")history.shift();
  chatAbort=new AbortController();
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:chatAbort.signal,
      headers:{"content-type":"application/json","x-api-key":chatKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:chatModel(),max_tokens:1200,stream:true,system:coachContext(),messages:history})});
    if(!res.ok){let msg="";try{const j=await res.json();msg=j.error&&j.error.message||""}catch{}
      ans.content=res.status===401?"La chiave API non è valida. Controllala nelle Impostazioni.":res.status===429?"Troppe richieste o credito esaurito: riprova tra poco o controlla il credito sulla Console Anthropic.":res.status===404?"Modello non disponibile: scegline un altro nelle Impostazioni.":`Errore ${res.status}. ${msg}`;ans.err=true;
    }else{
      const rd=res.body.getReader();const dec=new TextDecoder();let buf="",last=0;
      while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
        let i;while((i=buf.indexOf("\n\n"))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);
          const dl=ev.split("\n").find(x=>x.startsWith("data:"));if(!dl)continue;
          try{const d=JSON.parse(dl.slice(5));if(d.type==="content_block_delta"&&d.delta&&d.delta.type==="text_delta")ans.content+=d.delta.text;
            if(d.type==="error"){ans.content+="\n\nErrore: "+(d.error&&d.error.message||"risposta interrotta");ans.err=true}}catch{}}
        if(Date.now()-last>120){last=Date.now();const el=document.getElementById("chatlast");if(el){el.innerHTML=mdLite(ans.content);scrollChat()}}
      }
    }
  }catch(e){if(e&&e.name==="AbortError")ans.content+=ans.content?"\n\n(interrotto)":"(interrotto)";else{ans.content="Connessione non riuscita. Controlla internet e riprova.";ans.err=true}}
  if(!ans.content)ans.content="Nessuna risposta. Riprova.";
  chatBusy=false;chatAbort=null;saveChat();if(S.view==="chat"){render();scrollChat()}
}

    <p style="margin:0;font-size:.92rem">Serve una chiave API Anthropic: la crei su <b>console.anthropic.com</b> → API Keys. Resta salvata solo su questo telefono. Ogni domanda costa pochi centesimi: imposta un limite di spesa sulla Console.</p>
    ${chatKey()?`<div class="spread"><span>Chiave salvata ····${esc(chatKey().slice(-4))}</span><button class="danger" data-act="keydel">Cancella</button></div>`:
     `<div class="fld"><label for="apikey">Chiave API</label><input id="apikey" class="keyin" type="password" autocomplete="off" placeholder="sk-ant-…"></div><button class="btn btn-primary" data-act="keysave">Salva chiave</button>`}
    <div class="fld"><label>Modello</label><div class="seg">${CHAT_MODELS.map(([m,l])=>`<button data-act="setmodel" data-v="${m}" aria-pressed="${chatModel()===m}">${l}</button>`).join("")}</div></div>
   </div>
   <div class="card"><div class="eyebrow">Incrementi dei pesi</div>
    <p class="muted" style="margin:0;font-size:.9rem">Il passo minimo dei pesi nella tua palestra. Lo usano gli Obiettivi di oggi e i pulsanti + e −.</p>
    ${STEPCAT.map(c=>{const v=st[c.k]||c.d;return `<div class="steprow"><div><b>${c.lab}</b><span class="muted">${c.ex}</span></div>
      <div class="seg stepseg">${STEPOPT.map(o=>`<button data-act="setstep" data-k="${c.k}" data-v="${o}" aria-pressed="${v===o}">${String(o).replace(".",",")}</button>`).join("")}</div></div>`}).join("")}
   </div>
   <div class="card"><div class="eyebrow">Caricare una nuova scheda</div>
    <p style="margin:0">Manda a Claude in chat il PDF della scheda nuova: la trasforma e la aggiunge all'app, che ti propone di attivarla. In alternativa incolla qui il codice scheda che ti dà Claude.</p>
    <div class="fld"><label for="impprog">Codice scheda</label><textarea id="impprog" data-f="impprog" placeholder="Incolla qui il codice">${esc(S.impprog||"")}</textarea></div>
    <button class="btn btn-ghost" data-act="impprog">Aggiungi scheda</button></div>
   <div class="card"><div class="eyebrow">Backup</div>
    <p style="margin:0">I dati stanno solo su questo telefono. Fai un backup ogni tanto e incollalo nelle Note: se cambi telefono o cancelli l'app, lo ripristini da qui.</p>
    <button class="btn btn-ghost" data-act="backup">Copia backup</button>
    <div class="fld"><label for="restore">Ripristina da backup</label><textarea id="restore" data-f="restore" placeholder="Incolla qui il backup">${esc(S.restore||"")}</textarea></div>
    <button class="btn btn-ghost" data-act="restore">Ripristina</button>
    <label class="btn btn-primary filebtn" for="restfile">Carica da file (backup o storico Hevy)</label>
    <input type="file" id="restfile" accept=".txt,.json,text/plain,application/json" hidden></div>
   <p class="muted" style="font-size:.8rem;text-align:center">Scheda attiva: ${esc(ACTIVE.name)} · ${logs.length} sedute salvate</p>
  </div>`;
}
function importProg(txt){
  try{const p=JSON.parse(txt.trim());if(!p.id||!p.name||!p.from||!p.seds)throw 0;
    const ex=LS.get("pt-progs-extra",[]).filter(x=>x.id!==p.id);ex.push(p);LS.set("pt-progs-extra",ex);PROGS=allProgs();toast(`Scheda "${p.name}" aggiunta`);return true}
  catch{toast("Codice non valido: incolla tutto il testo che ti ha dato Claude");return false}
}
function activateProg(id){
  if(progById(id).archived){toast("Questa è una scheda storica: si può solo consultare");return}
  if(S.w){toast("Finisci o butta la seduta in corso prima di cambiare scheda");return}
  setActive(id);LS.set("pt-prog",id);const seen=LS.get("pt-seen",{});seen[id]=1;LS.set("pt-seen",seen);
  S.sel=null;S.v=null;S.histProg=id;toast(`Scheda attiva: ${ACTIVE.name}`);render();
}

/* ======= EVENTI ======= */
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;unlockAudio();
  const w=S.w;
  switch(a){
   case"go":S.view=v;S.confirm=null;render();window.scrollTo(0,0);break;
   case"sel":S.sel=v;S.v=nextVar(v);render();break;
   case"var":S.v=+v;render();break;
   case"start":unlockAudio();if(LS.get("pt-watchalert",true)){S.watchAlert=true;render()}else startWorkout();break;
   case"watchgo":S.watchAlert=false;startWorkout();break;
   case"watchno":if(e.target.closest(".wbox")&&b.classList.contains("walert"))break;S.watchAlert=false;render();break;
   case"resume":S.view="work";keepAwake();if(!w.cur)prefill();render();break;
   case"discard":S.w=null;saveDraft();render();break;
   case"inc":case"dec":{const j=+b.dataset.j,f=b.dataset.f,ex=PLAN[w.sed].ex[viewIdx()];const step=f==="kg"?stepFor(ex.p[Math.min(j,ex.p.length-1)].n):1;const A=curArr();
     const cur=parseFloat(String(A[j][f]).replace(",","."))||0;A[j][f]=f==="kg"?(a==="inc"?gridUp(cur,step):gridDown(cur,step)):Math.max(0,cur+(a==="inc"?1:-1));
     const inp=document.getElementById(f+j);if(inp)inp.value=String(A[j][f]).replace(".",",");saveDraft();break}
   case"editset":startEdit(viewIdx(),+v);break;
   case"canceledit":S.edit=null;backToRest();render();break;
   case"fixlast":if(w.last){S.rest.hidden=true;startEdit(w.last.i,w.last.s)}break;
   case"showrest":if(S.rest){S.rest.hidden=false;render()}break;
   case"log":logSet();break;
   case"work":{const ex=PLAN[w.sed].ex[w.i];if(ex.free){S.work={start:Date.now(),free:true}}else{const tp=cfg(ex,w.v).p.find(p=>p.k==="time");S.work={end:Date.now()+tp.v*1000}}keepAwake();render();break}
   case"stopwork":if(S.work&&S.work.free){w.cur[0].r=Math.round((Date.now()-S.work.start)/1000);S.work=null;logSet()}else{S.work=null;render()}break;
   case"rminus":S.rest.end-=15000;if(S.rest.end<Date.now()+1000)S.rest.end=Date.now()+1000;break;
   case"rplus":S.rest.end+=15000;S.rest.total+=15;break;
   case"rskip":S.rest=null;render();window.scrollTo(0,0);break;
   case"prevex":S.edit=null;if(w.i>0){w.i--;w.s=Math.min((w.data[PLAN[w.sed].ex[w.i].id]||[]).filter(Boolean).length,cfg(PLAN[w.sed].ex[w.i],w.v).sets-1);prefill();S.work=null;saveDraft();render();window.scrollTo(0,0)}break;
   case"skipex":S.edit=null;if(w.i>=PLAN[w.sed].ex.length-1){goFinish()}else{w.i++;w.s=0;prefill();S.work=null;saveDraft();render();window.scrollTo(0,0)}break;
   case"end":S.endMenu=true;S.endConfirm=false;render();break;
   case"endclose":if(e.target.closest(".sheet")&&b.classList.contains("sheetbg"))break;S.endMenu=false;S.endConfirm=false;render();break;
   case"endsave":S.endMenu=false;goFinish();break;
   case"enddiscard":if(S.endConfirm)discardWorkout();else{S.endConfirm=true;render()}break;
   case"back":S.view="work";render();break;
   case"keysave":{const k=(document.getElementById("apikey").value||"").trim();if(!/^sk-ant-/.test(k)){toast("La chiave deve iniziare con sk-ant-");break}LS.set("pt-apikey",k);toast("Chiave salvata su questo telefono");render();break}
   case"keydel":LS.del("pt-apikey");toast("Chiave cancellata");render();break;
   case"setmodel":LS.set("pt-model",v);render();break;
   case"chatsend":sendChat(S.chatDraft);break;
   case"chatq":sendChat(v);break;
   case"chatstop":if(chatAbort)chatAbort.abort();break;
   case"chatclear":if(S.chatConfirm){chatMsgs=[];saveChat();S.chatConfirm=false}else S.chatConfirm=true;render();break;
   case"asksync":S.view="chat";render();sendChat(v);break;
   case"togwatch":LS.set("pt-watchalert",!LS.get("pt-watchalert",true));render();break;
   case"setstep":{const st=LS.get("pt-steps",{});st[b.dataset.k]=+v;LS.set("pt-steps",st);toast("Incremento aggiornato");render();break}
   case"testsound":keepAwake();setTimeout(()=>{beep(3);setTimeout(()=>toast(wakeOk===false?"Se non hai sentito: alza il volume. Schermo sempre acceso non disponibile qui.":"Se non hai sentito niente, alza il volume multimediale."),900)},700);break;
   case"vid":if(window.ExAnim)ExAnim.open(v);break;
   case"rpe":S.rpe=+v;render();break;
   case"wedit":S.watchPaste=v;render();break;
   case"wsave":{const h=numP(document.getElementById("hhr").value);const l=logs.find(x=>x.id===v);if(l){saveLog({...l,watch:h==null?undefined:{hr:h}});S.watchPaste=null;toast("Battiti salvati");render()}break}
   case"wapply":{const p=parseWatchText(S.watchTxt);if(p)applyWatch(v,p);else toast("Testo non valido: deve contenere watch=1&kcal=…");break}
   case"suggok":(w.suggOk=w.suggOk||{})[v]=true;saveDraft();render();break;
   case"share":{shareText(buildReport(v));const sh=LS.get("pt-shared",{});sh[v]=1;LS.set("pt-shared",sh);setTimeout(render,1500);break}
   case"copyrep":copyText(buildReport(v));break;
   case"backup":copyText(backupStr());break;
   case"restore":if(restore(S.restore||"")){S.restore="";render()}break;
   case"hprog":S.histProg=v;S.open=null;S.showPlan=false;render();break;
   case"showplan":S.showPlan=!S.showPlan;render();break;
   case"activate":activateProg(v);break;
   case"later":{const seen=LS.get("pt-seen",{});seen[v]=1;LS.set("pt-seen",seen);render();break}
   case"impprog":if(importProg(S.impprog||"")){S.impprog="";render()}break;
   case"pain":S.pain=+v;render();break;
   case"stiff":{const l=logs.find(x=>x.id===b.dataset.id);if(l){saveLog({...l,stiff:+v});toast(+v===2?"Segnato. Oggi niente salti, e se resta così parlane col fisio.":"Segnato.");render()}break}
   case"save":finish();break;
   case"wk":S.wk=Math.min(0,S.wk+(+v));render();break;
   case"open":S.open=S.open===v?null:v;S.confirm=null;render();break;
   case"del":if(S.confirm===v){deleteLog(v);S.confirm=null;S.open=null;toast("Seduta eliminata")}else S.confirm=v;render();break;
  }
});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("portrait").catch(()=>{})}catch{}
app.addEventListener("keydown",e=>{if(e.target.id==="chatin"&&e.key==="Enter"&&!e.shiftKey&&!/iPhone|iPad|Android/i.test(navigator.userAgent)){e.preventDefault();sendChat(S.chatDraft)}});
app.addEventListener("change",e=>{const t=e.target;if(t.id!=="restfile"||!t.files||!t.files[0])return;
  const fr=new FileReader();fr.onload=()=>{if(restore(String(fr.result))){S.restore="";render();window.scrollTo(0,0)}};fr.onerror=()=>toast("Non riesco a leggere il file");fr.readAsText(t.files[0]);t.value=""});
app.addEventListener("input",e=>{const t=e.target;if(t.dataset.f==="note"){S.note=t.value;return}if(t.dataset.f==="restore"){S.restore=t.value;return}if(t.dataset.f==="impprog"){S.impprog=t.value;return}if(t.dataset.f==="wtxt"){S.watchTxt=t.value;return}if(t.dataset.f==="whr"){S.whr=t.value;return}if(t.dataset.f==="chatin"){S.chatDraft=t.value;t.style.height="auto";t.style.height=Math.min(140,t.scrollHeight)+"px";return}
  if(t.dataset.f&&S.w&&S.w.cur){curArr()[+t.dataset.j][t.dataset.f]=t.value;saveDraft()}});

onWatchArrive();
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}))}
</script>
</body>
